reset-time:
  hour: 0
  minute: 0
  # Elige el tipo de intervalo: "minutes" o "days"
  interval-type: "days"
  # Si interval-type es "minutes", usa este valor
  minutes-interval: 1
  # Si interval-type es "days", usa este valor
  days-interval: 1

reset-broadcast: true

reset-warnings:
  enabled: true
  minutes-before: 5

auto-save-interval: 300

backup-settings:
  max-backups: 10
  auto-backup-on-reset: true

contribution-settings:
  allow-extra-contributions: true
  block-after-completion: false

community-levels:
  enabled: true
  max-level: 10
  increment-per-level: 0.15

mission-rotation:
  items-per-day: 6

global-mission:
  base-multiplier: 30
  
item-categories:
  bloques-comunes:
    min-amount: 500
    max-amount: 1500
    display-color: "&6"
    items:
      - DIRT
      - COBBLESTONE
      - STONE
